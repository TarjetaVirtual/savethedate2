
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Fátima & Gonzalo | Save the Date</title>

  <style>
    :root {
      --fondo: #ffffff;
      --texto: #292722;
      --verde: #687052;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      color: var(--texto);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* INVITACIÓN BLANCA, SIN BORDES */

    .invitacion {
      width: 100%;
      max-width: 440px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: #ffffff;
      box-shadow: none;
      overflow: hidden;
    }

    .marco {
      border: none;
      border-radius: 0;
      overflow: hidden;
    }

    /* NOMBRES */

    .nombres {
      min-height: 75px;
      padding: 20px 5px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      white-space: nowrap;
      font-family: Didot, "Bodoni 72", "Times New Roman", serif;
      font-size: clamp(18px, 5.5vw, 25px);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .ampersand {
      margin: 0 8px;
      color: var(--verde);
      font-style: italic;
    }

    /* CARRUSEL */

    .carrusel {
      position: relative;
      width: 100%;
      aspect-ratio: .68;
      overflow: hidden;
      background: #eee9e2;
      touch-action: pan-y;
    }

    .pista {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform .5s ease;
    }

    .foto {
      position: relative;
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .foto img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .foto::after {
      content: "";
      position: absolute;
      inset: 40% 0 0;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(20, 18, 14, .48)
      );
      pointer-events: none;
    }

    /* TEXTO SOBRE LAS FOTOS */

    .save-date {
      position: absolute;
      z-index: 2;
      bottom: 28px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: clamp(38px, 10vw, 52px);
      font-weight: normal;
      line-height: 1.2;
      transform: rotate(-4deg);
      text-shadow: 0 2px 8px #00000050;
      pointer-events: none;
    }

    /* FLECHAS */

    .flecha {
      position: absolute;
      z-index: 3;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid #ffffffa0;
      border-radius: 50%;
      background: #22222255;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .flecha:hover {
      background: #222222aa;
    }

    .anterior {
      left: 10px;
    }

    .siguiente {
      right: 10px;
    }

    /* INDICADORES */

    .indicadores {
      position: absolute;
      z-index: 3;
      right: 14px;
      bottom: 10px;
      display: flex;
      gap: 6px;
    }

    .punto {
      width: 7px;
      height: 7px;
      border: 0;
      border-radius: 10px;
      background: #ffffff90;
      cursor: pointer;
      transition: width .2s;
    }

    .punto.activo {
      width: 19px;
      background: #ffffff;
    }

    /* FECHA */

    .fecha {
      min-height: 78px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(12px, 4vw, 19px);
      padding: 14px 5px;
      font-family: Didot, "Bodoni 72", "Times New Roman", serif;
      font-size: 28px;
      letter-spacing: .06em;
    }

    /* MENSAJE */

    .detalles {
      padding: 22px 19px;
      text-align: center;
    }

    .subtitulo {
      margin-bottom: 12px;
      color: var(--verde);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .mensaje {
      margin-bottom: 22px;
      font-size: 15px;
      line-height: 1.8;
    }

    /* BOTÓN GOOGLE CALENDAR */

    .boton-calendar {
      width: 100%;
      min-height: 48px;
      padding: 14px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--verde);
      background: var(--verde);
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .04em;
      line-height: 1.5;
      text-transform: uppercase;
      transition: background .2s, color .2s;
    }

    .boton-calendar:hover {
      background: #ffffff;
      color: var(--verde);
    }

    .boton-calendar svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .nota {
      margin-top: 15px;
      color: #777267;
      font-family: Arial, sans-serif;
      font-size: 10px;
      line-height: 1.6;
    }

    /* PANTALLAS PEQUEÑAS */

    @media (max-width: 350px) {
      .nombres {
        font-size: 16px;
      }

      .fecha {
        font-size: 24px;
      }
    }

    /* ACCESIBILIDAD */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
    
#botonMusica {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 10;
  padding: 10px 14px;
  border: 1px solid #687052;
  background: #ffffff;
  color: #687052;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 12px;
  cursor: pointer;
}

#botonMusica:hover {
  background: #687052;
  color: #ffffff;
}

#botonMusica {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 100;
  width: 30px;
  height: 30px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #68705280;
  border-radius: 50%;
  background: #ffffffdd;
  color: #687052;
  font-size: 14px;
  cursor: pointer;
  box-shadow: none;
}

#botonMusica:hover {
  background: #f7f4ef;
}
  </style>
</head>

<body>

  <main class="invitacion">
    <div class="marco">

      <!-- NOMBRES -->

      <header class="nombres">
        <span>Fátima</span>
        <span class="ampersand">&amp;</span>
        <span>Gonzalo</span>
      </header>

<audio id="musicaFondo" loop preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<button id="botonMusica" type="button" aria-label="Reproducir música">
  ♫ 
</button>
      <!-- CARRUSEL DE FOTOGRAFÍAS -->

      <section
        class="carrusel"
        id="carrusel"
        aria-label="Fotografías de los novios"
      >

        <div class="pista" id="pista">

          <!-- FOTO 1 -->

          <div class="foto">
            <img
              src="canva-pareja-romántica-abrazándose-en-un-paisaje-desértico-MAGzvajd-Mo.jpg"
              alt="Pareja abrazada en un momento romántico"
            >
          </div>

          <!-- FOTO 2 -->

          <div class="foto">
            <img
              src="images.jpg"
              alt="Pareja celebrando su amor"
            >
          </div>

        </div>

        <!-- TEXTO SOBRE LAS FOTOS -->

        <div class="save-date">save the date</div>

        <!-- FLECHAS -->

        <button
          class="flecha anterior"
          id="anterior"
          type="button"
          aria-label="Fotografía anterior"
        >&#8249;</button>

        <button
          class="flecha siguiente"
          id="siguiente"
          type="button"
          aria-label="Fotografía siguiente"
        >&#8250;</button>

        <!-- INDICADORES -->

        <div class="indicadores">

          <button
            class="punto activo"
            data-indice="0"
            aria-label="Mostrar fotografía 1"
            aria-current="true"
            type="button"
          ></button>

          <button
            class="punto"
            data-indice="1"
            aria-label="Mostrar fotografía 2"
            type="button"
          ></button>

        </div>
      </section>

      <!-- FECHA DE LA BODA -->

      <div class="fecha" aria-label="18 de enero de 2027">
        <span>18</span>
        <span>·</span>
        <span>01</span>
        <span>·</span>
        <span>27</span>
      </div>

      <!-- MENSAJE -->

      <section class="detalles">

        <p class="subtitulo">Un día para recordar</p>

        <p class="mensaje">
          Nos encantaría compartir<br>
          este momento contigo.<br>
          ¡Reserva la fecha!
        </p>

        <!-- GUARDAR EVENTO EN GOOGLE CALENDAR -->

        <a
          class="boton-calendar"
          id="botonCalendar"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="16" rx="1"></rect>
            <path d="M16 3v4M8 3v4M3 10h18"></path>
            <path d="m9 15 2 2 4-4"></path>
          </svg>

          Guardar evento en Google Calendar
        </a>

        <p class="nota">
          Con mucho cariño, esperamos celebrar contigo.
        </p>

      </section>

    </div>
  </main>

  <script>
    /* =====================================
       CONFIGURACIÓN DEL EVENTO
    ===================================== */

/* MÚSICA DE FONDO */

const musica = document.getElementById("musicaFondo");
const botonMusica = document.getElementById("botonMusica");

musica.volume = 0.35;

botonMusica.addEventListener("click", async () => {
  if (musica.paused) {
    try {
      await musica.play();
      botonMusica.textContent = "♫ Pausar música";
      botonMusica.setAttribute("aria-label", "Pausar música");
    } catch (error) {
      botonMusica.textContent = "No se pudo reproducir";
    }
  } else {
    musica.pause();
    botonMusica.textContent = "♫ Activar música";
    botonMusica.setAttribute("aria-label", "Reproducir música");
  }
});

musica.addEventListener("ended", () => {
  botonMusica.textContent = "♫ Activar música";
});
    const tituloEvento =
      "Fátima & Gonzalo - Nuestra boda";

    // 18 de enero de 2027
    const fechaInicio = "20270118";

    // El evento de día completo termina al día siguiente.
    const fechaFin = "20270119";

    const descripcionEvento =
      "Nos encantaría compartir este momento contigo. ¡Reserva la fecha!";

    const botonCalendar =
      document.getElementById("botonCalendar");

    const parametros = new URLSearchParams({
      action: "TEMPLATE",
      text: tituloEvento,
      dates: `${fechaInicio}/${fechaFin}`,
      details: descripcionEvento
    });

    botonCalendar.href =
      "https://calendar.google.com/calendar/render?" +
      parametros.toString();

    /* =====================================
       FUNCIONES DEL CARRUSEL
    ===================================== */

    const pista = document.getElementById("pista");

    const carrusel = document.getElementById("carrusel");

    const puntos = Array.from(
      document.querySelectorAll(".punto")
    );

    let indiceActual = 0;

    const totalFotos = puntos.length;

    function mostrarFoto(indice) {
      indiceActual =
        (indice + totalFotos) % totalFotos;

      pista.style.transform =
        `translateX(-${indiceActual * 100}%)`;

      puntos.forEach((punto, i) => {
        const activo = i === indiceActual;

        punto.classList.toggle("activo", activo);

        if (activo) {
          punto.setAttribute("aria-current", "true");
        } else {
          punto.removeAttribute("aria-current");
        }
      });
    }

    document
      .getElementById("anterior")
      .addEventListener("click", () => {
        mostrarFoto(indiceActual - 1);
      });

    document
      .getElementById("siguiente")
      .addEventListener("click", () => {
        mostrarFoto(indiceActual + 1);
      });

    puntos.forEach((punto) => {
      punto.addEventListener("click", () => {
        mostrarFoto(Number(punto.dataset.indice));
      });
    });

    /* =====================================
       DESLIZAR EN PANTALLAS TÁCTILES
    ===================================== */

    let inicioX = 0;
    let inicioY = 0;

    carrusel.addEventListener("touchstart", (evento) => {
      inicioX = evento.changedTouches[0].screenX;
      inicioY = evento.changedTouches[0].screenY;
    }, { passive: true });

    carrusel.addEventListener("touchend", (evento) => {
      const finalX = evento.changedTouches[0].screenX;
      const finalY = evento.changedTouches[0].screenY;

      const diferenciaX = finalX - inicioX;
      const diferenciaY = finalY - inicioY;

      if (
        Math.abs(diferenciaX) > 45 &&
        Math.abs(diferenciaX) > Math.abs(diferenciaY)
      ) {
        mostrarFoto(
          indiceActual + (diferenciaX < 0 ? 1 : -1)
        );
      }
    }, { passive: true });
  </script>

</body>
</html>
